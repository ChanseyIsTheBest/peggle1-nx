# Peggle-specific analysis corrections for the code generator.
#
# Every entry needs its evidence (which tool or which log found it). The tools that produce candidates:
#   tools/find_gaps.py, tools/gap_fixpoint.py   code the automatic discovery left without a function
#   tools/pointer_fixpoint.py                   code pointers stored in data (vtables, callback tables, CRT tables)
#   tools/switch_check.py                       jump tables the generator bounded wrongly
#   tools/runtime_gap_resolver.py               "Call to invalid or unregistered function" from a game log

# The CRT's setjmp/longjmp (root keys: they must stay outside any table). Found by shape (2026-10-21, an image scan for
# `stfd f14,0(r3); stfd f15,8(r3)` and `lfd f14,0(r7)`; tools/ppc_dis.py, tools/callers.py), the XDK CRT's as in
# Peggle 2 (and in Guwange, the Mushihimesama session's reminder):
#   setjmp  0x827A4B50: a hook word at 0x830A3920 is tried first (bnectr), mflr, mfcr, stfd f14-f31 at 0(r3)...;
#           8 call sites
#   longjmp 0x827A33E0: mflr, stwu, the check of +312, mr r7,r3, lfd f14-f31 from 0(r7)...; 4 call sites
# The image carries PopCap's image libraries (libpng / libjpeg error paths longjmp back); with the addresses the
# generator emits host setjmp/longjmp keyed by the guest jmp_buf.
setjmp_address = 0x827A4B50
longjmp_address = 0x827A33E0

