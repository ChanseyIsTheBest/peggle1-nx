peggle1_cpu_native_sub_825BA158 = true                  # native_sub_825BA158: localized copy of sub_825BA158: Wwise (0.4 %)

# ---- Non-CPU enhancements (62) ----
peggle1_native_edram4_clear_color0 = true               # edram4_clear_color0: a depth + color 0 clear drawn through a 4x alias is cleared in the 1x owners (no 4x draw and 4x -> 1x transfer)
peggle1_native_constants_dedupe = true                  # constants_dedupe: a new shader-constant generation with the bytes uploaded last reuses that block (no upload, no rebind)
peggle1_native_pass_narrow_end = true                   # pass_narrow_end: a render pass's end dependency names its real consumers instead of MEMORY_READ|WRITE
peggle1_native_zcull_1x_depth = false                   # zcull_1x_depth: 1x depth views keep their ZCULL plane (copy-engine stencil imports use masked stencil passes)  (EXPLICIT ONLY: off unless you set it; see the known issues)
masseffect_native_vs_relaxed_match = true               # vs_relaxed_match: vertex shaders whose fetch swizzles D3D patched are matched to the library
asset_pack = true                                       # asset_pack: game data read from game_root.nxpack instead of the folder (used anyway when only the pack exists)
banjo_deko3d_alpha_spec = true                          # renut_alpha_spec: Renut deko3d: the alpha test's function in the pipeline (constant 903)
banjo_deko3d_tess_spec = true                           # renut_tess_spec: Renut deko3d: no tessellation code in pipelines without it (constant 904)
banjo_deko3d_early_hoist = true                         # renut_early_hoist: Renut deko3d: the early alpha test's texture fetch hoisted
banjo_deko3d_early_z = true                             # renut_early_z: Renut deko3d: depth tested before a discarding shader in a draw that writes no depth (constant 909)
banjo_deko3d_txq_constants = true                       # renut_txq_constants: Renut deko3d: texture sizes from a buffer, not a texture query (constant 908)
banjo_deko3d_vs_outputs = true                          # renut_vs_outputs: Renut deko3d: vertex shaders write only what the pixel shader reads
banjo_deko3d_uam_prmt = true                            # renut_uam_prmt: Renut deko3d: uam's byte swaps as PRMT
banjo_deko3d_uam_gvn = true                             # renut_uam_gvn: Renut deko3d: uam's global value numbering
banjo_deko3d_uam_uniform_branches = true                # renut_uam_uniform_branches: Renut deko3d: uam's uniform branches without reconvergence
banjo_deko3d_uam_wide_rows = true                       # renut_uam_wide_rows: Renut deko3d: uam's 128-bit bone-row loads
banjo_deko3d_zcull = true                               # renut_zcull: Renut deko3d: hierarchical depth culling
banjo_deko3d_depth_compression = true                   # renut_depth_compression: Renut deko3d: compressed depth targets
banjo_deko3d_depth24 = true                             # renut_depth24: Renut deko3d: D24S8 targets as 24-bit depth
banjo_deko3d_depth_handover = true                      # renut_depth_handover: Renut deko3d: a whole depth resolve handed over, not drawn
banjo_deko3d_draw_resolves = true                       # renut_draw_resolves: Renut deko3d: colour resolves drawn on the 3D engine
banjo_deko3d_barrier_lean = true                        # renut_barrier_lean: Renut deko3d: write-only transitions keep the texture cache
banjo_deko3d_barrier_merge = true                       # renut_barrier_merge: Renut deko3d: back-to-back barriers merged
banjo_gpu_depth_only = true                             # renut_depth_only: Renut: depth-only pipelines for colourless draws
banjo_gpu_depth_words_view = true                       # renut_depth_words_view: Renut: a depth resolve's words read through its own texture
banjo_gpu_output_trim = true                            # renut_output_trim: Renut: colour outputs a pipeline never writes trimmed
banjo_gpu_bool_spec = true                              # renut_bool_spec: Renut: bool constants as specialisation constants
banjo_gpu_tess_grid = true                              # renut_tess_grid: Renut: tessellated patches as a precomputed grid
banjo_gpu_robustness_off = true                         # renut_robustness_off: Renut (Vulkan): pipelines without buffer and image robustness
banjo_gpu_nvk_draw_contract = true                      # renut_nvk_draw_contract: Renut on NVK: NVK's per-draw contract
banjo_gpu_blend_skip = true                             # renut_blend_skip: Renut: pixels whose blend changes nothing discarded
banjo_renut_precise_barriers = true                     # renut_precise_barriers: Renut (Vulkan): barriers' access masks from the layouts
banjo_renut_push_point_only = true                      # renut_push_point_only: Renut (Vulkan): the push constant read only by point sprites
banjo_renut_resolve_skip = true                         # renut_resolve_skip: Renut: a resolve of an unchanged source into the same texture not done again
banjo_renut_depth_words_lazy = true                     # renut_depth_words_lazy: Renut: a depth resolve's words written only when read
banjo_renut_memory_policy = true                        # renut_memory_policy: Renut: memory limits sized for the console
peggle1_renut_texture_cap_mb = 512                      # renut_texture_cap: Renut (deko3d): host textures above 512 MB released when not bound for 120 frames
banjo_renut_pipeline_cache = true                       # renut_pipeline_cache: Renut (Vulkan): the driver's pipelines kept on disk
banjo_renut_cache_save_quiet = true                     # renut_cache_save_quiet: Renut: the pipeline cache saved once no pipeline was built for a while
banjo_renut_linked_stages = true                        # renut_linked_stages: Renut on NVK (Switch): each pipeline's stages compiled together
banjo_deko3d_kick_submit = true                         # renut_kick_submit: Renut deko3d, input lag: command lists handed to the GPU at the game's kicks
banjo_late_input = true                                 # renut_late_input: Renut, input lag: a frame's first controller read as late as the render thread's slack allows
banjo_deko3d_eager_kicks = true                         # renut_eager_kicks: Renut deko3d, input lag: lists of 100 draws, up to 6 a frame, each sent to the GPU at its own kick
banjo_display_sync = true                               # renut_display_sync: Renut on the Switch, input lag: the frame limiter paced by the display's vsync event (phase auto, at most 12 ms)
peggle1_gpu_boost = true                                # boost: Handheld: ask for the official 460.8 MHz GPU profile (memory clock checked unchanged, else reverted)
peggle1_native_dedupe_sync_epochs = true                # dedupe_sync_epochs: Ring thread: the vertex dedupe and the index cache forget their recorded ranges at every GPU-to-game signal in the command stream (fence and memory writes, interrupts), the guest synchronization they were designed around (its counter was never advanced)
peggle1_gpu_lock_rechecks = true                        # lock_rechecks: The renderer reads a texture again at its next use when the game's loader has written it (or Direct3D announced a write lock of its memory); off = it waits for its recheck interval, so an atlas loaded into the previous level's memory shows the old image for up to 39 frames
peggle1_gpu_video_after_draws = true                    # video_after_draws: The game's video update (which starts the next Bink decode into the picture the frame just drew) waits until the ring thread has recorded the draws submitted so far: the picture is read before the decoder writes it (no bars and spots of half-decoded blocks in videos)
peggle1_vsync_relaxed = true                            # peggle1_vsync_relaxed: Relaxed vsync: the vblank that releases the game's flip follows its swap (at most one per 1/60 s after the previous vblank; the regular 1/60 s ticks otherwise), so a frame that misses 30 fps is shown when it is ready instead of at the next vblank: no fall from 30 straight to 20
peggle1_gpu_hd_atlases = true                           # hd_atlases: GPU: atlases from the HD pack in place of the game's 720 atlases (peggle1_hd_atlases: docked only or always); needs peggle1_hd.pack next to the program
peggle1_gpu_render_scale = true                         # render_scale: GPU: render at peggle1_render_height_handheld / peggle1_render_height_docked (720 / 1080 by default), following docked / handheld live; off = always the game's 1280x720
peggle1_native_linear_fetch_not_resolved = true         # linear_fetch_not_resolved: Renderer: a linear (untiled) texture fetch is never taken for a resolved texture (resolves write tiled layouts only): CPU data at a freed resolve's address is read from guest memory instead of being rejected (Wild Canyon's mission box centre)
peggle1_gpu_structured_cf = true                        # structured_cf: GPU: shaders whose forward-only control flow the translator proved equivalent as nested if/else run that form (SPEC_CONSTANT_STRUCTURED_CF) instead of an `if (skipTo <= pc)` test per CF instruction (needs the shader package that has it)
peggle1_gpu_push_once = true                            # push_once: GPU: the push constants (three addresses the set-4 specialized shaders never read) are recorded once per pass / command buffer instead of on every draw whose constant offsets moved (NVK: one 6-word root-table upload per draw less)
peggle1_gpu_texcoords_unswapped = true                  # texcoords_unswapped: GPU: vertex shaders skip the swapped-texcoord test of every texcoord input (a 64-bit mask test and a swizzle select per vertex): the native renderer never swaps them (g_SwappedTexcoords is always 0)
peggle1_gpu_no_texture_signs = true                     # no_texture_signs: GPU: when no texture of a draw has a signed, biased or gamma component, its pixel shader skips the per-fetch sign test (a shift, a compare and a branch per texture fetch)
peggle1_gpu_identity_remap = true                       # identity_remap: GPU: a pipeline whose vertex inputs all keep their component order (every g_InputRemap is 0xFFF) skips the per-input remap test in its vertex shader (a constant load, a compare and a branch per input)
peggle1_gpu_index_base_held = true                      # index_base_held: GPU: vertex shaders the translator proved never read the vertex index run with r0 starting at 0 (SPEC_CONSTANT_VERTEX_INDEX_UNUSED) and the per-draw vertex index base is held at 0, so draws keep the same shared constant block and set-4 binding (needs the shader package that has it)
peggle1_gpu_blend_skip = true                           # blend_skip: GPU: transparent pixels (alpha 0 or less with SRC_ALPHA / ONE_MINUS_SRC_ALPHA or additive blending, or an all-zero source with ONE / ONE_MINUS_SRC_ALPHA) are discarded before the blend when the blend would leave the RGBA8 target unchanged and nothing writes depth or stencil
peggle1_gpu_resolve_draw = true                         # resolve_draw: GPU: same-format RGBA8 color resolves are drawn on the 3D engine (one fragment pass that copies the texels) instead of vkCmdCopyImage on NVK's copy engine (no engine switch and wait for idle per resolve)
peggle1_gpu_resolve_alias = true                        # resolve_alias: GPU: a color resolve that repeats the previous one (same render target and rectangle, nothing in between) into another texture is not copied; that texture takes the bytes of the first one when something reads it or before the first one changes (a copy, or an exchange of the two images when the first one is overwritten whole). SA2's 1E8A0000 and 1F6F8000 are never read
peggle1_native_partial_resolve_inside = true            # partial_resolve_inside: Renderer: a resolve is a later rectangle of an existing resolved texture only when it declares that texture's height (or the height left below its row) and its rectangle lies inside it; a whole texture allocated a few pages above a freed one of the same size gets its own texture instead of being written into the old one
